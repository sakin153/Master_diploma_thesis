x-bake:
  dockerfile: Dockerfile

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Base image must be built first: docker build -f Dockerfile.base -t embodiedgen-base:latest .
    image: embodiedgen-api:latest
    container_name: embodiedgen-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      # LLM для физ. параметров — локальный Ollama на хосте
      GPT_AGENT_TYPE: ${GPT_AGENT_TYPE:-ollama}
      # Из контейнера хостовый localhost доступен через host.docker.internal
      OLLAMA_HOST: http://host.docker.internal:11434/v1
      MODEL_NAME: ${MODEL_NAME:-qwen3.5:cloud}

      # Text-to-image модель (sdxl-turbo для 8GB GPU)
      TEXT_MODEL: ${TEXT_MODEL:-sd15}

      # Hunyuan3D texture pipeline: "1" включить (последовательно после shape)
      HUNYUAN3D_TEXTURE: ${HUNYUAN3D_TEXTURE:-0}

      # Пути внутри контейнера — фиксированные, хост-пути задаются через .env
      OUTPUT_ROOT: /app/outputs/jobs
      HF_HOME: /app/weights/hf_cache
      HY3DGEN_MODELS: /app/weights/hy3dgen
      MODELSCOPE_CACHE: /app/weights/modelscope_cache
      TORCH_HOME: /app/weights/torch_cache
      U2NET_HOME: /app/weights/u2net
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # Open3D OffscreenRenderer падает с segfault в headless Docker (нет EGL).
      # Пропускаем Open3D и используем matplotlib-рендеринг напрямую.
      SKIP_OPEN3D_RENDER: "1"

    volumes:
      # Хост-пути задаются в .env (скопируй из .env.example).
      # По умолчанию — ./weights/*, что переиспользует уже скачанные модели.
      - ${HF_CACHE_HOST:-./weights/hf_cache}:/app/weights/hf_cache
      - ${HY3DGEN_CACHE_HOST:-./weights/hy3dgen}:/app/weights/hy3dgen
      - ${TORCH_CACHE_HOST:-./weights/torch_cache}:/app/weights/torch_cache
      - ${U2NET_CACHE_HOST:-./weights/u2net}:/app/weights/u2net
      - ./outputs:/app/outputs
      - ./asset_gen/utils/gpt_config.yaml:/app/asset_gen/utils/gpt_config.yaml

    # Позволяет контейнеру обращаться к хостовому localhost (Ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          memory: 13g
        reservations:
          memory: 4g
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    shm_size: "8gb"

# Именованные volumes удалены — используются bind mounts выше.

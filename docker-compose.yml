x-bake:
  dockerfile: Dockerfile

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Base image must be built first: docker build -f Dockerfile.base -t embodiedgen-base:latest .
    image: embodiedgen-api:latest
    container_name: embodiedgen-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      # LLM для физ. параметров — локальный Ollama на хосте
      GPT_AGENT_TYPE: ${GPT_AGENT_TYPE:-ollama}
      # Из контейнера хостовый localhost доступен через host.docker.internal
      OLLAMA_HOST: http://host.docker.internal:11434/v1
      MODEL_NAME: ${MODEL_NAME:-qwen3.5:cloud}

      # Text-to-image модель (sdxl-turbo для 8GB GPU)
      TEXT_MODEL: ${TEXT_MODEL:-sd15}

      # Hunyuan3D texture pipeline: "1" включить (нужно ~6 GB доп. VRAM), "0" выключить
      HUNYUAN3D_TEXTURE: ${HUNYUAN3D_TEXTURE:-0}

      # Пути внутри контейнера
      OUTPUT_ROOT: /app/outputs/jobs
      HF_HOME: /app/weights/hf_cache
      MODELSCOPE_CACHE: /app/weights/modelscope_cache
      TORCH_HOME: /app/weights/torch_cache
      # rembg u2net model cache — persisted in volume to avoid re-downloading
      U2NET_HOME: /app/weights/u2net
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    volumes:
      - weights:/app/weights
      - outputs:/app/outputs
      - ./embodied_gen/utils/gpt_config.yaml:/app/embodied_gen/utils/gpt_config.yaml
      # Reuse models already downloaded on Windows — avoids HuggingFace SSL issues
      - C:\Users\slva_\.cache\huggingface:/app/weights/hf_cache
      - C:\Users\slva_\.cache\hy3dgen:/root/.cache/hy3dgen

    # Позволяет контейнеру обращаться к хостовому localhost (Ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          memory: 13g
        reservations:
          memory: 4g
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    shm_size: "8gb"

volumes:
  weights:
    driver: local
  outputs:
    driver: local
